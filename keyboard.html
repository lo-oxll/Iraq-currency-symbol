<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيبورد الكوفي والأرقام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="iraq-dinar.css">
<style>
:root{--ink:#12141C;--gold:#C8952E;--bg:#f3f1ea;--line:#E4E1D8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.app{width:100%;max-width:440px}
h1{font-size:20px;font-weight:800;text-align:center;margin:2px 0 8px}
.k,.screen{font-family:"Iraq Kufic","Iraq Dinar Digits",sans-serif}
.screen{background:var(--ink);color:#fff;border-radius:16px;min-height:120px;padding:12px 14px;font-size:clamp(44px,13vw,60px);line-height:1.6;direction:rtl;text-align:right;overflow-wrap:anywhere;display:flex;align-items:center}
.screen .ph{font:600 17px Cairo,sans-serif;color:#8e8b82;width:100%;text-align:center}
.rows{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.r{display:grid;gap:5px;direction:rtl;justify-content:center}
.k{background:#fff;border:1px solid var(--line);border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--ink);cursor:pointer;touch-action:manipulation;padding:0}
.k:active{background:#e9e5d8;transform:scale(.96)}
.k.g{background:var(--gold);border-color:var(--gold)}.k.d{background:var(--ink);color:#fff;border-color:var(--ink)}
.k.u{font:800 16px Cairo,sans-serif}
.num .k{height:62px;font-size:38px}
.act{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:6px;margin-top:8px}
.act .k{height:50px;font:800 16px Cairo,sans-serif}
.hint{font-size:13px;color:#6f6a5d;text-align:center;margin:10px 4px 0}
a{color:var(--ink)}
</style>
</head>
<body><div class="app">
<h1>كيبورد الكوفي والأرقام</h1>
<div class="screen" id="s"></div>
<div class="rows" id="kb"></div>
<div class="act">
  <button class="k g" id="cpy">نسخ النص</button>
  <button class="k d" id="png">صورة PNG</button>
  <button class="k u" id="clr">مسح</button>
</div>
<p class="hint">النص المنسوخ يظهر بالخط الكوفي حيث يكون <a href="IraqKufic-Regular.ttf">الخط</a> مثبّتاً. <a href="index.html">الرئيسية</a></p>
</div>
<script>
var AR=[['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح'],['ج','د','ش','س','ي','ب','ل','ا','ت','ن'],['م','ك','ط','ئ','ء','ؤ','ر','ى','ة','و'],['ز','ظ','ذ','أ','إ','آ','،','؟']];
var txt='',layer='ar';
function show(){document.getElementById('s').innerHTML=txt?'':'<span class="ph">اضغط على الحروف</span>';if(txt)document.getElementById('s').textContent=txt}
function key(label,fn,cls){var b=document.createElement('button');b.className='k '+(cls||'');b.textContent=label;b.onclick=fn;return b}
function add(c){if(txt.length<80){txt+=c;show()}}
function del(){txt=Array.from(txt).slice(0,-1).join('');show()}
function row(items,cols){var r=document.createElement('div');r.className='r';r.style.gridTemplateColumns=cols;items.forEach(function(i){r.appendChild(i)});return r}
function build(){
  var kb=document.getElementById('kb');kb.innerHTML='';kb.className='rows'+(layer==='num'?' num':'');
  if(layer==='ar'){
    AR.forEach(function(rw){kb.appendChild(row(rw.map(function(c){return key(c,function(){add(c)})}),'repeat(10,minmax(0,1fr))'))});
    kb.appendChild(row([key('١٢٣',function(){layer='num';build()},'d u'),key('مسافة',function(){add(' ')},'u'),key('⌫',del,'u')],'1fr 3fr 1fr'));
  }else{
    var d=['1','2','3','4','5','6','7','8','9','\uE900','0','.'];
    for(var i=0;i<12;i+=3)kb.appendChild(row(d.slice(i,i+3).map(function(c){var k=key(c,function(){add(c)},c==='\uE900'?'g':'');return k}),'repeat(3,1fr)'));
    kb.appendChild(row([key('حروف',function(){layer='ar';build()},'d u'),key('،',function(){add('،')}),key('مسافة',function(){add(' ')},'u'),key('⌫',del,'u')],'1.2fr 1fr 1.6fr 1fr'));
  }
}
document.getElementById('cpy').onclick=function(){var b=this;if(!txt)return;navigator.clipboard.writeText(txt).then(function(){b.textContent='تم ✓';setTimeout(function(){b.textContent='نسخ النص'},1400)})};
document.getElementById('clr').onclick=function(){txt='';show()};
document.getElementById('png').onclick=function(){
  if(!txt)return;
  Promise.all([document.fonts.load('100px "Iraq Kufic"'),document.fonts.load('100px "Iraq Dinar Digits"')]).then(function(){
    var f='130px "Iraq Kufic","Iraq Dinar Digits"',c=document.createElement('canvas'),x=c.getContext('2d');
    x.font=f;x.direction='rtl';var w=Math.ceil(x.measureText(txt).width)+80;
    c.width=w;c.height=300;x=c.getContext('2d');x.font=f;x.direction='rtl';x.textAlign='right';x.textBaseline='alphabetic';
    x.fillStyle='#12141C';x.fillText(txt,w-40,190);
    c.toBlob(function(bl){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='kufic-text.png';a.click()})})};
build();show();
</script>
</body>
</html>
