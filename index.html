<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>الرمز = د.ع = IQD</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{background:#f3f1ea;padding:32px 16px;font-family:'Cairo',sans-serif;}
  .showcase{max-width:460px;margin:0 auto;}
  h2{text-align:center;font-size:16px;color:#12141C;margin-bottom:6px;}
  .sub{text-align:center;color:#8A8578;font-size:13px;margin-bottom:30px;}

  .group{background:#fff;border:1px solid #E4E1D8;border-radius:14px;padding:18px;margin-bottom:16px;}
  .group .three{display:flex;align-items:center;justify-content:space-around;}
  .form{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
  .form .value{font-weight:800;font-size:20px;color:#12141C;}
  .form .tag{font-size:11px;color:#8A8578;}
  .eq{font-size:18px;color:#C8952E;font-weight:800;}

  .status{text-align:center;margin-top:20px;font-size:13px;color:#8A8578;}
</style>
</head>
<body>

<div class="showcase">
  <h2>الرمز = د.ع = IQD</h2>
  <p class="sub">نفس السعر، ثلاث طرق لكتابته</p>

  <div class="group">
    <div class="three">
      <div class="form"><span class="value">150 <span class="currency-fallback">د.ع</span><span class="currency-icon" aria-label="دينار">&#xE900;</span></span><span class="tag">الرمز</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">150 د.ع</span><span class="tag">د.ع</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">150 IQD</span><span class="tag">IQD</span></div>
    </div>
  </div>

  <div class="group">
    <div class="three">
      <div class="form"><span class="value">5,000 <span class="currency-fallback">د.ع</span><span class="currency-icon" aria-label="دينار">&#xE900;</span></span><span class="tag">الرمز</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">5,000 د.ع</span><span class="tag">د.ع</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">5,000 IQD</span><span class="tag">IQD</span></div>
    </div>
  </div>

  <div class="group">
    <div class="three">
      <div class="form"><span class="value">25,000 <span class="currency-fallback">د.ع</span><span class="currency-icon" aria-label="دينار">&#xE900;</span></span><span class="tag">الرمز</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">25,000 د.ع</span><span class="tag">د.ع</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">25,000 IQD</span><span class="tag">IQD</span></div>
    </div>
  </div>

  <p class="status" id="status">جارِ التحقق من تحميل الخط...</p>
</div>

<script>
  if ("fonts" in document) {
    document.fonts.load('16px "GoldDinarCurrency"').then(function (loaded) {
      var status = document.getElementById("status");
      if (loaded && loaded.length > 0) {
        document.documentElement.classList.add("currency-font-ready");
        document.documentElement.classList.add("currency-show-text");
        status.textContent = "✅ عمود \"الرمز\" يتبدّل تلقائيًا بين الشكلين ليؤكد أنه نفس الشيء";
        (function cycle(){
          setTimeout(function () {
            document.documentElement.classList.remove("currency-show-text");
            setTimeout(function () {
              document.documentElement.classList.add("currency-show-text");
              cycle();
            }, 1000);
          }, 5000);
        })();
      } else {
        status.textContent = "⚠️ لم يتم العثور على الخط";
      }
    }).catch(function () {
      document.getElementById("status").textContent = "❌ فشل تحميل الخط";
    });
  }
</script>
</body>
</html>
