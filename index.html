<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرمز = د.ع = IQD</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#f3f1ea;padding:24px 14px;font-family:'Cairo',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .showcase{width:100%;max-width:1000px;margin:0 auto;}
  h2{text-align:center;font-size:clamp(22px,6vw,30px);font-weight:800;color:#12141C;margin:0 0 4px;}
  .sub{text-align:center;color:#8A8578;font-size:clamp(15px,4vw,18px);margin:0 0 18px;}

  .group{background:#fff;border:1px solid #E4E1D8;border-radius:16px;padding:20px 14px;margin-bottom:12px;}
  .group .three{display:flex;align-items:center;justify-content:space-around;gap:8px;}
  .form{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
  .form .value{font-weight:800;font-size:clamp(26px,3.4vw,36px);color:#12141C;white-space:nowrap;line-height:1.3;}
  .form .tag{font-size:15px;color:#8A8578;}
  .eq{font-size:26px;color:#C8952E;font-weight:800;line-height:1;}

  /* الجوال: كل صيغة في سطر مستقل، مسافات أقل وخط أكبر */
  @media (max-width:640px){
    body{padding:14px 10px;}
    .group{padding:10px 12px;margin-bottom:10px;border-radius:14px;}
    .group .three{flex-direction:column;gap:0;}
    .form{flex-direction:row;justify-content:space-between;width:100%;gap:10px;padding:4px 2px;}
    .form .value{font-size:34px;}
    .form .tag{font-size:16px;font-weight:600;}
    .eq{font-size:20px;height:14px;display:flex;align-items:center;}
  }
  .dlink{display:block;width:max-content;margin:0 auto 16px;background:#12141C;color:#fff;text-decoration:none;font-weight:800;padding:10px 22px;border-radius:12px;font-size:17px;}
</style>
</head>
<body>

<div class="showcase">
  <h2>الرمز = د.ع = IQD</h2>
  <p class="sub">نفس السعر، ثلاث طرق لكتابته</p>
    <a class="dlink" href="downloads.html">حمّل الرمز واستخدمه مجاناً</a>

  <div class="group">
    <div class="three">
      <div class="form"><span class="value">150 <span class="currency-icon" aria-label="دينار"></span></span><span class="tag">الرمز</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">150 د.ع</span><span class="tag">د.ع</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">150 IQD</span><span class="tag">IQD</span></div>
    </div>
  </div>

  <div class="group">
    <div class="three">
      <div class="form"><span class="value">5,000 <span class="currency-icon" aria-label="دينار"></span></span><span class="tag">الرمز</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">5,000 د.ع</span><span class="tag">د.ع</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">5,000 IQD</span><span class="tag">IQD</span></div>
    </div>
  </div>

  <div class="group">
    <div class="three">
      <div class="form"><span class="value">25,000 <span class="currency-icon" aria-label="دينار"></span></span><span class="tag">الرمز</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">25,000 د.ع</span><span class="tag">د.ع</span></div>
      <span class="eq">=</span>
      <div class="form"><span class="value">25,000 IQD</span><span class="tag">IQD</span></div>
    </div>
  </div>
</div>

</body>
</html>
