<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأرقام ذات الزوايا — 0 إلى 9</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="iraq-dinar.css">
<style>
:root{--ink:#12141C;--gold:#C8952E;--bg:#f3f1ea;--line:#E4E1D8;--muted:#6f6a5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Iraq Digits','Cairo',sans-serif;line-height:1.6;padding:18px 12px 36px}
.w{max-width:960px;margin:0 auto}
h1{text-align:center;font-size:clamp(24px,6.5vw,36px);font-weight:800;margin:0}
.sub{text-align:center;color:var(--muted);font-size:clamp(15px,4vw,18px);margin:2px 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.live{background:var(--ink);color:#fff;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.live input{width:100%;max-width:320px;font:800 24px 'Iraq Digits',Cairo,sans-serif;text-align:center;border:2px solid var(--gold);border-radius:12px;padding:6px;background:#fff;color:var(--ink);direction:ltr}
.out{direction:ltr;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.12em;font-size:clamp(54px,17vw,96px);margin-top:10px;min-height:1.1em}
.out svg{height:1em;width:.6em;stroke:currentColor}
.out .c{font-weight:800;font-size:.7em;color:#c9c6bd;margin:0 .05em}
.out svg.sym{width:1.097em;margin-inline-start:.2em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.d{text-align:center}
.d svg{height:92px;width:56px;stroke:var(--ink)}
.d b{display:block;font-size:18px;font-weight:800;margin-top:4px}
.d span{font-size:15px;color:var(--muted);font-weight:600}
.note{margin-top:12px;font-size:15px;color:var(--muted);text-align:center}
a{color:var(--ink)}
</style>
</head>
<body><div class="w">
<h1>الأرقام ذات الزوايا</h1>
<p class="sub">كل رقم فيه من الزوايا بقدر قيمته</p>

<div class="live">
  <input id="n" value="25000" inputmode="numeric" maxlength="12" aria-label="اكتب رقماً">
  <div class="out" id="out"></div>
</div>

<div class="grid" id="g"></div>
<p class="note">بنفس سماكة رمز الدينار ليتناسق الرقم مع الرمز. <a href="index.html">العودة للرمز</a></p>
</div>
<script>
// خطوط كل رقم (مسار مركزي، سماكة 9) — viewBox 0 0 60 100
var P={
0:'<ellipse cx="30" cy="50" rx="18" ry="38"/>',
1:'<path d="M14 30L36 12L36 88"/>',
2:'<path d="M12 12L48 12L12 88L48 88"/>',
3:'<path d="M12 12L48 12L16 50L48 88L12 88"/>',
4:'<path d="M36 12L10 62L36 62M36 12L36 88"/>',
5:'<path d="M48 12L12 12L12 48L48 48L48 88L12 88L12 72"/>',
6:'<path d="M48 12L12 12L12 88L48 88L48 50L12 50"/>',
7:'<path d="M10 12L48 12L20 88M12 52L46 52M8 88L32 88"/>',
8:'<path d="M12 12L48 12L12 88L48 88Z"/>',
9:'<path d="M48 50L48 12L12 12L12 50L48 50L48 88L12 88L12 64L28 64L28 72"/>'};
var L=['صفر زاوية','زاوية واحدة','زاويتان','ثلاث زوايا','أربع زوايا','خمس زوايا','ست زوايا','سبع زوايا','ثمان زوايا','تسع زوايا'];
function svg(d){return '<svg viewBox="0 0 60 100" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">'+P[d]+'</svg>'}
document.getElementById('g').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(function(d){
  return '<div class="card d">'+svg(d)+'<b>'+d+'</b><span>'+L[d]+'</span></div>'}).join('');
function draw(){
  var v=document.getElementById('n').value.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[^0-9]/g,'');
  var s=v.split('').reverse().join('').replace(/(\d{3})(?=\d)/g,'$1,').split('').reverse().join('');
  document.getElementById('out').innerHTML=s.split('').map(function(c){return c===','?'<span class="c">,</span>':svg(c)}).join('')+(v?'<svg class="sym" viewBox="36.6 27.39 115.4 105.22" fill="none"><path fill="currentColor" stroke="none" d="M61.3 124.8L61.3 35.2L70.6 35.4L75.1 35.7L79.5 36.1L83.7 36.8L87.7 37.6L91.6 38.6L95.4 39.8L99 41.1L102.5 42.6L105.8 44.2L109 45.9L112 47.8L114.9 49.8L117.5 52L120.1 54.2L122.5 56.6L124.7 59.1L126.7 61.6L128.6 64.3L130.3 67L131.9 69.8L133.2 72.7L134.5 75.6L136 80L134.5 84.4L133.2 87.3L131.9 90.2L130.3 93L128.6 95.7L126.7 98.4L124.7 100.9L122.5 103.4L120.1 105.8L117.5 108L114.9 110.2L112 112.2L109 114.1L105.8 115.8L102.5 117.4L99 118.9L95.4 120.2L91.6 121.4L87.7 122.4L83.7 123.2L79.5 123.9L75.1 124.3L70.6 124.6ZM70.2 115.2L74.3 114.9L78.2 114.5L82 113.9L85.6 113.2L89.1 112.3L92.4 111.3L95.6 110.1L98.6 108.8L101.5 107.4L104.2 105.9L106.8 104.3L109.2 102.6L111.5 100.8L113.6 98.9L115.6 96.9L117.5 94.8L119.2 92.7L120.8 90.5L122.2 88.2L123.5 85.9L124.6 83.5L125.6 81L126 80L125.6 79L124.6 76.5L123.5 74.1L122.2 71.8L120.8 69.5L119.2 67.3L117.5 65.2L115.6 63.1L113.6 61.1L111.5 59.2L109.2 57.4L106.8 55.7L104.2 54.1L101.5 52.6L98.6 51.2L95.6 49.9L92.4 48.7L89.1 47.7L85.6 46.8L82 46.1L78.2 45.5L74.3 45.1L70.2 44.8L70.7 44.8L70.7 115.2ZM40.6 35.3L50 35.3L50 124.7L40.6 124.7ZM117.9 101.3L148 101.3L148 110.7L105.3 110.7Z"/></svg>':'');
}
document.getElementById('n').addEventListener('input',draw);draw();
</script>
</body>
</html>
